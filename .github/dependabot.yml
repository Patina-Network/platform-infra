version: 2

multi-ecosystem-groups:
  # cannot enable until the bun `/` entry below is enabled
  # main:
  #   schedule: { interval: weekly }
  #   commit-message: { prefix: "deps(main)" }
  cicd:
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(ci)" }
  # uncomment this section to run dependabot on tooling that is not part of the main app and/or is not very important to the main repository
  # non-main:
  #   schedule: { interval: monthly }
  #   commit-message: { prefix: "deps(non-main)" }

updates:
  # main
  # cannot enable: @pulumi/headscale is `file:sdks/headscale`, an SDK Pulumi generates from Pulumi.yaml `packages:`.
  # sdks/ is gitignored, so Dependabot's checkout can't `bun install` anything ("Could not find folder file:sdks/headscale").
  # - package-ecosystem: bun
  #   directory: /
  #   patterns: ["*"]
  #   cooldown: { default-days: 7 }
  #   multi-ecosystem-group: main
  # cicd
  - package-ecosystem: github-actions
    directories:
      - /
      - "/.github/composite/**"
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: cicd
  # cannot enable until https://github.com/dependabot/dependabot-core/issues/15237 is fixed
  # - package-ecosystem: bun
  #   directory: /.github/scripts
  #   patterns: ["*"]
  #   cooldown: { default-days: 7 }
  #   multi-ecosystem-group: cicd
